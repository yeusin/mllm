name: Release Executables

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-executables:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Linux aarch64 (ARM64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-latest
          # macOS Apple Silicon (aarch64)
          - target: aarch64-apple-darwin
            os: macos-latest
          # macOS Universal (x86_64 + aarch64)
          - target: universal-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so `git describe` can resolve the latest tag on
          # manual (workflow_dispatch) runs
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Extract version from release tag
        shell: bash
        run: |
          # Release runs: use the published tag. Manual runs: fall back to the
          # latest version tag reachable from the checkout.
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi
          VERSION="${TAG#v}"
          if [ -n "$VERSION" ]; then
            echo "MLLM_VERSION=$VERSION" >> "$GITHUB_ENV"
            echo "Injected version: $VERSION"
          else
            echo "No tag found; binary will fall back to manifest version"
          fi

      - name: Build, package, and upload release binary
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: mllm
          target: ${{ matrix.target }}
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256
          include: README.md,mllm.yaml.example
