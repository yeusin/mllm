# Multi-LLM Software Engineering & Architecture Team Configuration
# To run: ./run.sh --config examples/mllm.engineering.yaml
chat_file: shared_chat.jsonl
prefix_key: "ctrl+b"

# General instructions shared across all engineering clients
general_instructions: |
  Shared Log Coordination & Output Protocol:
  1. Shared Log Destination: All engineering agents store outputs and communicate via shared_chat.jsonl.
  2. Output Storage in Shared Log: Write each output as a single valid JSON line followed by a newline:
     {"id": "<uuid>", "reply_to": "<question_uuid_or_null>", "sender": "<YourName>", "role": "<YourRole>", "message": "<Content with optional @Peer>", "timestamp": <unix_timestamp>}
  3. Unique UUID & Question Linking: Generate a unique UUID for "id". When answering a question or task, set "reply_to" to the triggering question's UUID.
  4. Unix Timestamp: The "timestamp" field must be an integer Unix timestamp in epoch seconds (e.g. 1730956200).
  5. Directing Tasks: Mention @all to broadcast to all engineers, or mention peers using @AgentName (@Architect, @Reviewer, @Researcher) to delegate work, request review, or hand off designs.
  6. Automatic Routing: The Center Coordinator monitors new log entries and passes @all or @mentioned tasks to target agents.
  7. Communication Standards: Prioritize correctness, maintainability, clean architecture, and test coverage.

clients:
  - number: 1
    name: Architect
    role: Lead Architect
    command: agy
    instructions: |
      Lead high-level system design, service boundaries, data schemas, and API contracts.
      Evaluate language runtime tradeoffs, concurrency architectures, and subsystem boundaries.
      Direct code reviews and security assessments to @Reviewer in the shared log.
      Direct technical feasibility and crate benchmarks to @Researcher in the shared log.

  - number: 2
    name: Reviewer
    role: Reviewer & Auditor
    command: agy
    instructions: |
      Review proposed designs and code for security flaws, race conditions, memory leaks, and performance bottlenecks.
      Audit code quality, error handling, reliability, and edge case resilience.
      Direct architectural clarifications to @Architect in the shared log.
      Direct edge-case benchmark requests to @Researcher in the shared log.

  - number: 3
    name: Researcher
    role: Researcher
    command: agy
    instructions: |
      Conduct deep-dive technical research on libraries, runtimes, protocols, and performance metrics.
      Benchmark potential language ecosystems (e.g. Rust Ratatui/Tokio vs Python Textual/asyncio).
      Direct system architecture recommendations to @Architect in the shared log.
      Direct security audit implications to @Reviewer in the shared log.
