[package]
name = "mllm"
version = "0.5.2"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.191"
notify = "8.2.1"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
shell-words = "1.1.1"
tokio = { version = "1.54.1", features = ["full"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
uuid = { version = "1.29.1", features = ["v4", "v5", "serde"] }
vt100 = "0.18.1"

# Vendored vt100 0.18.1 with a minimal patch (see vendor/vt100/src/perform.rs):
# - CSI s / CSI u (SCOSC/SCORC cursor save/restore) — previously silently
#   ignored, causing OpenCode/OpenTUI panes to draw on wrong rows
# - ESC D (IND) / ESC E (NEL) line advance — previously silently ignored
[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[[bench]]

name = "bench_scaling"
harness = false
