[package]
name = "mllm"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
chrono = { version = "0.4.45", features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.191"
notify = "8.2.1"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
shell-words = "1.1.1"
tokio = { version = "1.54.1", features = ["full"] }
unicode-width = "0.2"
uuid = { version = "1.29.1", features = ["v4", "serde"] }
vt100 = "0.18.1"
